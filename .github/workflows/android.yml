name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Incluir los últimos partidos como respaldo
        run: |
          if [ -f events.json ]; then cp events.json www/events.json; else echo '{"events":[]}' > www/events.json; fi

      - name: Preparar proyecto Android
        run: |
          npm install
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar el APK para descargarlo directo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk agenda-deportiva.apk
          TAG="beta-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" agenda-deportiva.apk --title "Agenda deportiva $TAG" --notes "APK de prueba. Descarga agenda-deportiva.apk e instálalo."
