name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer los partidos de hoy y mañana
        continue-on-error: true
        run: |
          pip install requests
          python agenda_futbol.py
          cp agenda_futbol.html www/index.html

      - name: Preparar proyecto Android
        run: |
          npm install
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: agenda-deportiva-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK para descargarlo directo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk agenda-deportiva.apk
          TAG="beta-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" agenda-deportiva.apk --title "Agenda deportiva $TAG" --notes "APK de prueba. Descarga agenda-deportiva.apk e instálalo."
